<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Momentum — جدول خلاصهٔ هفته</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #111827; --ink-2: #4b5563; --muted: #9ca3af; --line: #e5e7eb; --soft: #f3f4f6; --primary: #2563eb; --ok: #16a34a; --danger: #dc2626; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e5e7eb; color: var(--ink); font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif; font-size: 13px; line-height: 1.6; }
    .toolbar { position: sticky; top: 0; background: #111827; color: #fff; padding: 10px 20px; display: flex; gap: 10px; align-items: center; z-index: 5; }
    .toolbar button, .toolbar a { background: var(--primary); color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; font: inherit; cursor: pointer; text-decoration: none; }
    .toolbar .ghost { background: transparent; border: 1px solid rgba(255,255,255,.3); }
    .toolbar .sp { flex: 1; }
    .toolbar small { opacity: .7; }
    .page { background: #fff; width: 210mm; margin: 20px auto; padding: 14mm 12mm; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
    .head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 20px; }
    .brand { font-size: 11px; color: var(--muted); letter-spacing: 2px; }
    .meta { color: var(--ink-2); font-size: 12px; text-align: left; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 7px 8px; border: 1px solid var(--line); text-align: right; }
    th { background: var(--soft); font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
    th.n, td.n { text-align: center; direction: ltr; font-variant-numeric: tabular-nums; white-space: nowrap; }
    tr.total td { background: var(--soft); font-weight: 800; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 6px; vertical-align: middle; }
    .pct.good { color: var(--ok); font-weight: 700; } .pct.bad { color: var(--danger); font-weight: 700; }
    .sub { color: var(--ink-2); font-size: 12px; margin: 10px 0 0; }
    .empty { color: var(--muted); text-align: center; padding: 30px; }
    .foot { margin-top: 14px; color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 6px; }
    @page { size: A4 landscape; margin: 10mm; }
    @media print { body { background: #fff; } .toolbar { display: none; } .page { width: auto; margin: 0; padding: 0; box-shadow: none; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">🖨️ چاپ / ذخیره PDF</button>
    <a class="ghost" id="prev" href="#">‹ هفتهٔ قبل</a>
    <a class="ghost" id="next" href="#">هفتهٔ بعد ›</a>
    <a class="ghost" id="full" href="#">گزارش کامل (All Plan)</a>
    <span class="sp"></span>
    <small>در پنجرهٔ چاپ، مقصد را «Save as PDF» بگذار</small>
  </div>
  <div class="page" id="page">در حال بارگذاری…</div>
  <script src="/jalali.js"></script>
  <script>
  (async () => {
    const J = Jalali;
    const FA = '۰۱۲۳۴۵۶۷۸۹';
    const fa = (n) => String(n).replace(/\d/g, (d) => FA[d]);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const hmc = (m) => { m = m | 0; return fa(Math.floor(m / 60)) + ':' + fa(String(m % 60).padStart(2, '0')); };
    const fmtDate = (s) => { const j = J.parse(s); return `${fa(j.jd)} ${J.MONTHS[j.jm - 1]} ${fa(j.jy)}`; };
    const fmtShort = (s) => { const j = J.parse(s); return `${fa(j.jd)} ${J.MONTHS[j.jm - 1]}`; };
    const pct = (p) => (p == null ? '<span style="color:var(--muted)">—</span>' : `<span class="pct ${p >= 50 ? 'good' : p < 20 ? 'bad' : ''}">${fa(p)}٪</span>`);
    const dash = (v) => (v ? fa(v) : '<span style="color:var(--muted)">—</span>');

    const date = new URLSearchParams(location.search).get('date') || J.todayJalali();
    const w = await (await fetch(`/api/week?date=${date}`)).json();
    const { start, end, stats, entries, settings } = w;
    document.title = `خلاصهٔ هفتهٔ ${fmtShort(start)} تا ${fmtShort(end)}`;
    document.getElementById('prev').href = `/summary.html?date=${J.addDays(start, -7)}`;
    document.getElementById('next').href = `/summary.html?date=${J.addDays(start, 7)}`;
    document.getElementById('full').href = `/report.html?date=${start}`;

    const rows = stats.bySubject;
    const sum = (k) => rows.reduce((s, r) => s + (r[k] || 0), 0);
    const days = new Set(entries.map((e) => e.date)).size;

    document.getElementById('page').innerHTML = `
      <div class="head">
        <div><div class="brand">MOMENTUM · خلاصهٔ هفته</div><h1>هفتهٔ ${fmtShort(start)} تا ${fmtDate(end)}</h1></div>
        <div class="meta">${settings.user_name ? esc(settings.user_name) + '<br>' : ''}${fa(days)} روز مطالعه · ${fa(entries.length)} جلسه</div>
      </div>
      ${rows.length ? `<table>
        <thead><tr>
          <th>درس</th><th class="n">جلسه</th><th class="n">مطالعهٔ کل</th><th class="n">خواندن</th><th class="n">مرور</th><th class="n">تست زدن</th>
          <th class="n">تعداد تست</th><th class="n">درست</th><th class="n">غلط</th><th class="n">درصد</th>
        </tr></thead>
        <tbody>
          ${rows.map((r) => `<tr>
            <td><span class="dot" style="background:${r.color}"></span>${esc(r.name)}</td>
            <td class="n">${fa(r.count)}</td>
            <td class="n"><b>${hmc(r.minutes)}</b></td>
            <td class="n">${r.study_min ? hmc(r.study_min) : dash(0)}</td>
            <td class="n">${r.review_min ? hmc(r.review_min) : dash(0)}</td>
            <td class="n">${r.test_min ? hmc(r.test_min) : dash(0)}</td>
            <td class="n">${dash(r.tests)}</td><td class="n">${dash(r.correct)}</td><td class="n">${dash(r.wrong)}</td>
            <td class="n">${pct(r.percent)}</td>
          </tr>`).join('')}
          <tr class="total">
            <td>جمع هفته</td>
            <td class="n">${fa(sum('count'))}</td>
            <td class="n">${hmc(sum('minutes'))}</td>
            <td class="n">${hmc(sum('study_min'))}</td>
            <td class="n">${hmc(sum('review_min'))}</td>
            <td class="n">${hmc(sum('test_min'))}</td>
            <td class="n">${fa(sum('tests'))}</td><td class="n">${fa(sum('correct'))}</td><td class="n">${fa(sum('wrong'))}</td>
            <td class="n">${pct(stats.percent)}</td>
          </tr>
        </tbody>
      </table>
      <p class="sub">زمان‌ها به صورت ساعت:دقیقه · درصد با نمرهٔ منفی: (۳×درست − غلط) ÷ (۳×کل)</p>` : '<div class="empty">این هفته چیزی ثبت نشده</div>'}
      <div class="foot"><span>Momentum</span><span>${fmtDate(J.todayJalali())}</span></div>`;
  })();
  </script>
</body>
</html>
